<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img">
  <title>本站自制抽象科学徽标</title>
  <desc>深蓝圆形底衬金色细环，中心为原子轨道与展开书本结合的抽象几何图形，下方标注 USTC 字样。</desc>

  <!-- 渐变与裁切 -->
  <defs>
    <linearGradient id="logoDisc" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#003f88"/>
      <stop offset="0.55" stop-color="#002a5c"/>
      <stop offset="1" stop-color="#001b3d"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#e8c86a"/>
    </linearGradient>
    <linearGradient id="logoBook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#b9c8db"/>
    </linearGradient>
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="logoClip">
      <circle cx="120" cy="120" r="112"/>
    </clipPath>
  </defs>

  <!-- 圆底与外环 -->
  <circle cx="120" cy="120" r="112" fill="url(#logoDisc)"/>
  <circle cx="120" cy="120" r="112" fill="#14539f" opacity="0.18"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#logoGold)" stroke-width="2.6"/>
  <circle cx="120" cy="120" r="94" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.45"/>

  <!-- 内部暗面层次 -->
  <g clip-path="url(#logoClip)">
    <ellipse cx="120" cy="196" rx="118" ry="70" fill="#001630" opacity="0.5"/>
    <ellipse cx="76" cy="62" rx="70" ry="42" fill="#2f7fd4" opacity="0.16"/>
  </g>

  <!-- 原子轨道 -->
  <circle cx="120" cy="100" r="54" fill="url(#logoGlow)"/>
  <g fill="none" stroke="#7fd1ff" stroke-width="2.4" opacity="0.9">
    <ellipse cx="120" cy="100" rx="62" ry="23"/>
    <ellipse cx="120" cy="100" rx="62" ry="23" transform="rotate(60 120 100)" stroke="#9fdcff"/>
    <ellipse cx="120" cy="100" rx="62" ry="23" transform="rotate(120 120 100)" stroke="#c9a227"/>
  </g>

  <!-- 轨道上的电子节点 -->
  <g>
    <circle cx="176" cy="86" r="9" fill="#ffd97a" opacity="0.28"/>
    <circle cx="176" cy="86" r="5" fill="#ffd97a"/>
    <circle cx="89" cy="51" r="8" fill="#7fd1ff" opacity="0.3"/>
    <circle cx="89" cy="51" r="4.5" fill="#bfe8ff"/>
    <circle cx="64" cy="130" r="8" fill="#7fd1ff" opacity="0.3"/>
    <circle cx="64" cy="130" r="4.5" fill="#bfe8ff"/>
    <circle cx="158" cy="140" r="7" fill="#c9a227" opacity="0.3"/>
    <circle cx="158" cy="140" r="4" fill="#ffd97a"/>
  </g>

  <!-- 原子核 -->
  <circle cx="120" cy="100" r="14" fill="#ffd97a" opacity="0.35"/>
  <circle cx="120" cy="100" r="8" fill="#ffd97a"/>
  <circle cx="117" cy="97" r="3" fill="#fff6dd"/>

  <!-- 中心书本 -->
  <g>
    <path d="M120 142 C 100 130 74 127 56 132 L 56 158 C 74 153 100 156 120 168 Z" fill="url(#logoBook)"/>
    <path d="M120 142 C 140 130 166 127 184 132 L 184 158 C 166 153 140 156 120 168 Z" fill="url(#logoBook)"/>
    <path d="M120 142 C 100 130 74 127 56 132 L 56 158 C 74 153 100 156 120 168 Z" fill="#2f7fd4" opacity="0.12"/>
    <rect x="117" y="140" width="6" height="28" rx="3" fill="#c9a227"/>
    <g stroke="#003f88" stroke-width="1.6" opacity="0.5">
      <path d="M70 138 L 108 145"/>
      <path d="M70 147 L 108 154"/>
      <path d="M132 145 L 170 138"/>
      <path d="M132 154 L 170 147"/>
    </g>
  </g>

  <!-- 底部文字 -->
  <text x="120" y="208" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="bold" letter-spacing="6" fill="#c9a227">USTC</text>
</svg>
