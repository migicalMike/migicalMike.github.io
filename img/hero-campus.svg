<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>暮色中的中国科学技术大学校园全景</title>
  <desc>深蓝暮色天空下层层递进的校园建筑剪影，中央偏右的主楼与塔楼点缀暖黄色窗灯，前景是广场、路灯与成排树木的剪影。</desc>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b52"/>
      <stop offset="0.42" stop-color="#123c72"/>
      <stop offset="0.76" stop-color="#1a528f"/>
      <stop offset="1" stop-color="#1d5a9e"/>
    </linearGradient>
    <linearGradient id="heroGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2949"/>
      <stop offset="1" stop-color="#03101f"/>
    </linearGradient>
    <linearGradient id="heroHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a477a"/>
      <stop offset="1" stop-color="#0e2d52"/>
    </linearGradient>
    <linearGradient id="heroMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a528f"/>
      <stop offset="1" stop-color="#0a2445"/>
    </linearGradient>
    <linearGradient id="heroWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0cd"/>
      <stop offset="1" stop-color="#ffd97a"/>
    </linearGradient>
    <radialGradient id="heroMoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2f8ff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#a9cdf0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a9cdf0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5a9e" stop-opacity="0"/>
      <stop offset="1" stop-color="#1d5a9e" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="heroVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02101f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#02101f" stop-opacity="0.62"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#heroSky)"/>
  <circle cx="1215" cy="152" r="140" fill="url(#heroMoon)"/>
  <circle cx="1215" cy="152" r="46" fill="#eaf3fd" opacity="0.82"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="180" cy="118" r="2.4"/><circle cx="322" cy="72" r="1.8"/><circle cx="470" cy="146" r="2.2"/>
    <circle cx="612" cy="86" r="1.6"/><circle cx="760" cy="132" r="2.6"/><circle cx="905" cy="66" r="1.9"/>
    <circle cx="1042" cy="128" r="2.1"/><circle cx="1382" cy="92" r="2.3"/><circle cx="1490" cy="176" r="1.7"/>
    <circle cx="256" cy="222" r="1.6"/><circle cx="660" cy="232" r="1.9"/><circle cx="1330" cy="242" r="1.7"/>
  </g>

  <!-- 远山与地平线薄雾 -->
  <path d="M0 486 Q 210 424 430 470 Q 620 508 830 462 Q 1090 404 1300 464 Q 1460 506 1600 470 L1600 620 L0 620 Z" fill="url(#heroHill)"/>
  <rect x="0" y="430" width="1600" height="130" fill="url(#heroFog)"/>

  <!-- 远景建筑群 -->
  <g fill="#0f3358" opacity="0.9">
    <rect x="36" y="462" width="96" height="104"/>
    <rect x="150" y="486" width="62" height="80"/>
    <rect x="228" y="444" width="118" height="122"/>
    <rect x="362" y="474" width="84" height="92"/>
    <rect x="1246" y="458" width="104" height="108"/>
    <rect x="1366" y="480" width="72" height="86"/>
    <rect x="1454" y="448" width="126" height="118"/>
  </g>

  <!-- 中景教学楼 -->
  <g fill="#0a2745">
    <rect x="452" y="418" width="152" height="148"/>
    <rect x="486" y="386" width="84" height="34"/>
    <rect x="632" y="452" width="126" height="114"/>
    <rect x="700" y="424" width="24" height="30"/>
  </g>

  <!-- 主楼建筑群 -->
  <g>
    <rect x="754" y="382" width="146" height="200" fill="#0e3055"/>
    <rect x="1326" y="392" width="152" height="190" fill="#0e3055"/>
    <polygon points="1105,108 1130,182 1080,182" fill="#1d5a9e" opacity="0.75"/>
    <circle cx="1105" cy="112" r="26" fill="url(#heroLamp)"/>
    <circle cx="1105" cy="110" r="7" fill="#ffd97a"/>
    <rect x="1050" y="188" width="110" height="152" fill="url(#heroMain)"/>
    <rect x="880" y="330" width="460" height="252" rx="4" fill="url(#heroMain)"/>
    <rect x="1036" y="174" width="138" height="20" rx="5" fill="#2f7fd4" opacity="0.45"/>
    <rect x="860" y="310" width="500" height="24" rx="6" fill="#2f7fd4" opacity="0.4"/>
    <rect x="1176" y="286" width="168" height="46" rx="4" fill="#0e3055"/>
  </g>

  <!-- 窗灯阵列 -->
  <g fill="url(#heroWin)">
    <path d="M1076 208h16v18h-16z M1116 208h16v18h-16z M1076 240h16v18h-16z M1116 240h16v18h-16z M1076 272h16v18h-16z M1116 272h16v18h-16z M1076 304h16v18h-16z"/>
    <path d="M910 352h34v22h-34z M982 352h34v22h-34z M1054 352h34v22h-34z M1198 352h34v22h-34z M1270 352h34v22h-34z"/>
    <path d="M910 392h34v22h-34z M1054 392h34v22h-34z M1126 392h34v22h-34z M1270 392h34v22h-34z"/>
    <path d="M982 432h34v22h-34z M1054 432h34v22h-34z M1198 432h34v22h-34z"/>
    <path d="M910 472h34v22h-34z M982 472h34v22h-34z M1126 472h34v22h-34z M1270 472h34v22h-34z"/>
    <path d="M782 412h24v20h-24z M782 452h24v20h-24z M782 492h24v20h-24z M848 412h24v20h-24z M848 492h24v20h-24z"/>
    <path d="M1356 420h24v20h-24z M1356 460h24v20h-24z M1356 500h24v20h-24z M1422 420h24v20h-24z M1422 500h24v20h-24z"/>
    <path d="M480 448h22v18h-22z M516 448h22v18h-22z M480 486h22v18h-22z M552 486h22v18h-22z M660 480h22v18h-22z M696 480h22v18h-22z"/>
  </g>
  <g fill="#061d36">
    <path d="M1126 352h34v22h-34z M982 392h34v22h-34z M1126 472h34v22h-34z M848 452h24v20h-24z M1422 460h24v20h-24z M516 486h22v18h-22z"/>
  </g>

  <!-- 广场地面 -->
  <rect x="0" y="556" width="1600" height="344" fill="url(#heroGround)"/>
  <ellipse cx="1110" cy="600" rx="330" ry="34" fill="#2f7fd4" opacity="0.14"/>
  <ellipse cx="240" cy="612" rx="200" ry="24" fill="#2f7fd4" opacity="0.09"/>
  <ellipse cx="1420" cy="606" rx="220" ry="26" fill="#ffd97a" opacity="0.07"/>

  <!-- 中景树列 -->
  <g fill="#08243f">
    <g transform="translate(146,660) scale(0.55)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
    <g transform="translate(392,652) scale(0.5)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
    <g transform="translate(676,664) scale(0.58)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
    <g transform="translate(944,656) scale(0.52)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
    <g transform="translate(1216,662) scale(0.56)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
    <g transform="translate(1478,654) scale(0.5)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="60"/></g>
  </g>

  <!-- 广场景观灯 -->
  <g>
    <circle cx="252" cy="684" r="46" fill="url(#heroLamp)"/>
    <circle cx="252" cy="684" r="9" fill="#ffd97a"/>
    <rect x="248" y="690" width="8" height="150" fill="#05192e"/>
    <circle cx="700" cy="700" r="42" fill="url(#heroLamp)"/>
    <circle cx="700" cy="700" r="8" fill="#ffd97a"/>
    <rect x="696" y="706" width="8" height="140" fill="#05192e"/>
    <circle cx="1348" cy="692" r="46" fill="url(#heroLamp)"/>
    <circle cx="1348" cy="692" r="9" fill="#ffd97a"/>
    <rect x="1344" y="698" width="8" height="148" fill="#05192e"/>
  </g>

  <!-- 前景树木剪影 -->
  <g fill="#051729">
    <g transform="translate(94,806) scale(1.18)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(322,776) scale(0.88)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(556,812) scale(1.3)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(806,772) scale(0.82)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(1012,804) scale(1.06)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(1268,782) scale(0.94)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
    <g transform="translate(1494,808) scale(1.22)"><path d="M-65 0 C -84 -24 -70 -54 -42 -58 C -40 -84 -8 -96 14 -80 C 40 -96 74 -80 74 -54 C 100 -44 104 -12 82 0 Z"/><rect x="-7" y="-6" width="14" height="90"/></g>
  </g>

  <!-- 前景灌木与地面暗部 -->
  <g fill="#03101f">
    <ellipse cx="440" cy="872" rx="150" ry="34"/>
    <ellipse cx="900" cy="884" rx="180" ry="30"/>
    <ellipse cx="1420" cy="866" rx="160" ry="36"/>
  </g>
  <rect x="0" y="0" width="1600" height="900" fill="url(#heroVignette)"/>
</svg>
