<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>樱花大道</title>
  <desc>一条向远处收束成一点的校园大道，两侧樱花树成排，粉色云状树冠层层退远，花瓣随风飘落，尽头是淡蓝色的建筑轮廓。</desc>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="crSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4fa"/>
      <stop offset="0.55" stop-color="#dcecfb"/>
      <stop offset="1" stop-color="#eaf3fd"/>
    </linearGradient>
    <linearGradient id="crRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e0ec"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="crGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ed3b4"/>
      <stop offset="1" stop-color="#3f9c6a"/>
    </linearGradient>
    <linearGradient id="crFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c8db"/>
      <stop offset="1" stop-color="#d6e0ec"/>
    </linearGradient>
  </defs>

  <!-- 天空与远景 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#crSky)"/>
  <ellipse cx="176" cy="96" rx="74" ry="24" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="640" cy="70" rx="58" ry="18" fill="#ffffff" opacity="0.6"/>
  <g fill="url(#crFar)">
    <rect x="238" y="228" width="54" height="66"/>
    <rect x="300" y="248" width="40" height="46"/>
    <rect x="352" y="216" width="62" height="78"/>
    <rect x="422" y="252" width="46" height="42"/>
    <rect x="472" y="236" width="58" height="58"/>
  </g>
  <rect x="0" y="288" width="800" height="10" fill="#c7d7e8" opacity="0.6"/>

  <!-- 草地 -->
  <polygon points="0,292 376,292 62,600 0,600" fill="url(#crGrass)"/>
  <polygon points="800,292 424,292 738,600 800,600" fill="url(#crGrass)"/>
  <polygon points="0,292 376,292 372,300 0,306" fill="#2f7a52" opacity="0.35"/>
  <polygon points="800,292 424,292 428,300 800,306" fill="#2f7a52" opacity="0.35"/>

  <!-- 道路与透视中线 -->
  <polygon points="62,600 738,600 424,292 376,292" fill="url(#crRoad)"/>
  <polygon points="62,600 738,600 726,600 74,600" fill="#b9c8db" opacity="0.5"/>
  <polygon points="96,600 128,600 388,300 384,300" fill="#c9a227" opacity="0.28"/>
  <polygon points="704,600 672,600 412,300 416,300" fill="#c9a227" opacity="0.28"/>
  <g fill="#ffffff" opacity="0.85">
    <polygon points="396,308 404,308 402,322 398,322"/>
    <polygon points="395,336 405,336 403,360 397,360"/>
    <polygon points="393,382 407,382 404,424 396,424"/>
    <polygon points="390,456 410,456 406,522 394,522"/>
    <polygon points="386,570 414,570 408,600 392,600"/>
  </g>

  <!-- 左侧樱花树 -->
  <g>
    <ellipse cx="82" cy="596" rx="76" ry="14" fill="#0b2b52" opacity="0.1"/>
    <path d="M76 596 L 70 356 L 94 356 L 88 596 Z" fill="#7a5a4a"/>
    <path d="M82 384 L 40 344 M84 372 L 126 336" stroke="#7a5a4a" stroke-width="7" fill="none"/>
    <circle cx="34" cy="286" r="52" fill="#fbd6e4"/>
    <circle cx="132" cy="272" r="50" fill="#f6b8cf"/>
    <circle cx="82" cy="228" r="58" fill="#fbd6e4"/>
    <circle cx="62" cy="306" r="42" fill="#ef8fb4"/>
    <circle cx="112" cy="318" r="36" fill="#e0719c" opacity="0.8"/>
    <circle cx="86" cy="262" r="38" fill="#fbe4ee" opacity="0.8"/>
  </g>
  <g>
    <ellipse cx="212" cy="456" rx="52" ry="10" fill="#0b2b52" opacity="0.1"/>
    <path d="M208 456 L 205 312 L 220 312 L 217 456 Z" fill="#7a5a4a"/>
    <path d="M212 330 L 186 306 M214 322 L 240 300" stroke="#7a5a4a" stroke-width="5" fill="none"/>
    <circle cx="180" cy="272" r="34" fill="#fbd6e4"/>
    <circle cx="244" cy="264" r="32" fill="#f6b8cf"/>
    <circle cx="212" cy="238" r="38" fill="#fbd6e4"/>
    <circle cx="202" cy="292" r="26" fill="#ef8fb4"/>
    <circle cx="228" cy="298" r="22" fill="#e0719c" opacity="0.8"/>
  </g>
  <g>
    <path d="M300 372 L 298 306 L 308 306 L 306 372 Z" fill="#7a5a4a"/>
    <path d="M303 316 L 288 302 M304 312 L 318 300" stroke="#7a5a4a" stroke-width="3.5" fill="none"/>
    <circle cx="284" cy="286" r="21" fill="#fbd6e4"/>
    <circle cx="324" cy="282" r="20" fill="#f6b8cf"/>
    <circle cx="303" cy="266" r="24" fill="#fbd6e4"/>
    <circle cx="300" cy="296" r="16" fill="#ef8fb4"/>
  </g>
  <g>
    <path d="M348 330 L 347 298 L 353 298 L 352 330 Z" fill="#7a5a4a"/>
    <circle cx="336" cy="288" r="13" fill="#fbd6e4"/>
    <circle cx="362" cy="286" r="12" fill="#f6b8cf"/>
    <circle cx="349" cy="276" r="15" fill="#fbd6e4"/>
  </g>

  <!-- 右侧樱花树 -->
  <g>
    <ellipse cx="726" cy="596" rx="76" ry="14" fill="#0b2b52" opacity="0.1"/>
    <path d="M714 596 L 708 356 L 732 356 L 726 596 Z" fill="#7a5a4a"/>
    <path d="M720 384 L 678 344 M722 372 L 764 336" stroke="#7a5a4a" stroke-width="7" fill="none"/>
    <circle cx="672" cy="286" r="52" fill="#f6b8cf"/>
    <circle cx="770" cy="272" r="50" fill="#fbd6e4"/>
    <circle cx="722" cy="228" r="58" fill="#fbd6e4"/>
    <circle cx="700" cy="306" r="42" fill="#e0719c" opacity="0.85"/>
    <circle cx="750" cy="318" r="36" fill="#ef8fb4"/>
    <circle cx="724" cy="262" r="38" fill="#fbe4ee" opacity="0.8"/>
  </g>
  <g>
    <ellipse cx="592" cy="456" rx="52" ry="10" fill="#0b2b52" opacity="0.1"/>
    <path d="M586 456 L 583 312 L 598 312 L 595 456 Z" fill="#7a5a4a"/>
    <path d="M590 330 L 564 306 M592 322 L 618 300" stroke="#7a5a4a" stroke-width="5" fill="none"/>
    <circle cx="560" cy="272" r="34" fill="#f6b8cf"/>
    <circle cx="624" cy="264" r="32" fill="#fbd6e4"/>
    <circle cx="592" cy="238" r="38" fill="#fbd6e4"/>
    <circle cx="582" cy="292" r="26" fill="#ef8fb4"/>
    <circle cx="608" cy="298" r="22" fill="#e0719c" opacity="0.8"/>
  </g>
  <g>
    <path d="M500 372 L 498 306 L 508 306 L 506 372 Z" fill="#7a5a4a"/>
    <path d="M503 316 L 488 302 M504 312 L 518 300" stroke="#7a5a4a" stroke-width="3.5" fill="none"/>
    <circle cx="484" cy="286" r="21" fill="#f6b8cf"/>
    <circle cx="524" cy="282" r="20" fill="#fbd6e4"/>
    <circle cx="503" cy="266" r="24" fill="#fbd6e4"/>
    <circle cx="500" cy="296" r="16" fill="#ef8fb4"/>
  </g>
  <g>
    <path d="M452 330 L 451 298 L 457 298 L 456 330 Z" fill="#7a5a4a"/>
    <circle cx="440" cy="288" r="13" fill="#f6b8cf"/>
    <circle cx="466" cy="286" r="12" fill="#fbd6e4"/>
    <circle cx="453" cy="276" r="15" fill="#fbd6e4"/>
  </g>

  <!-- 飘落花瓣 -->
  <g fill="#f6b8cf">
    <ellipse cx="150" cy="180" rx="5" ry="3" transform="rotate(24 150 180)"/>
    <ellipse cx="286" cy="140" rx="5" ry="3" transform="rotate(-32 286 140)"/>
    <ellipse cx="392" cy="212" rx="4" ry="2.5" transform="rotate(48 392 212)"/>
    <ellipse cx="520" cy="168" rx="5" ry="3" transform="rotate(-14 520 168)"/>
    <ellipse cx="648" cy="200" rx="5" ry="3" transform="rotate(36 648 200)"/>
    <ellipse cx="222" cy="368" rx="6" ry="3.5" transform="rotate(-40 222 368)"/>
    <ellipse cx="470" cy="404" rx="6" ry="3.5" transform="rotate(18 470 404)"/>
    <ellipse cx="330" cy="470" rx="7" ry="4" transform="rotate(-26 330 470)"/>
    <ellipse cx="556" cy="516" rx="7" ry="4" transform="rotate(30 556 516)"/>
    <ellipse cx="182" cy="530" rx="8" ry="4.5" transform="rotate(-18 182 530)"/>
  </g>
  <g fill="#ef8fb4" opacity="0.85">
    <ellipse cx="96" cy="250" rx="5" ry="3" transform="rotate(52 96 250)"/>
    <ellipse cx="700" cy="146" rx="5" ry="3" transform="rotate(-22 700 146)"/>
    <ellipse cx="424" cy="338" rx="5" ry="3" transform="rotate(12 424 338)"/>
    <ellipse cx="264" cy="548" rx="8" ry="4.5" transform="rotate(40 264 548)"/>
    <ellipse cx="620" cy="452" rx="6" ry="3.5" transform="rotate(-34 620 452)"/>
    <ellipse cx="448" cy="560" rx="8" ry="4.5" transform="rotate(20 448 560)"/>
  </g>
</svg>
